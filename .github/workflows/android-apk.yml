name: Build Android APK

on:
  push:
    branches: [android-apk]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build Kotlin/JS application
        run: ./gradlew build jsBrowserDistribution

      - name: Copy web app into Android assets
        shell: bash
        run: |
          set -euo pipefail
          INDEX="$(find build/dist -type f -name index.html -print -quit)"
          if [[ -z "$INDEX" ]]; then
            echo "index.html not found in build/dist" >&2
            exit 1
          fi
          WEB_DIR="$(dirname "$INDEX")"
          mkdir -p android/app/src/main/assets/www
          cp -R "$WEB_DIR"/. android/app/src/main/assets/www/
          test -s android/app/src/main/assets/www/tendercheck.js

      - name: Generate launcher icon from supplied artwork
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y imagemagick
          base64 -d android/icon-source.jpg.b64 > /tmp/tendercheck-icon.jpg
          declare -A sizes=(
            [mdpi]=48
            [hdpi]=72
            [xhdpi]=96
            [xxhdpi]=144
            [xxxhdpi]=192
          )
          for density in "${!sizes[@]}"; do
            size="${sizes[$density]}"
            out="android/app/src/main/res/mipmap-$density"
            mkdir -p "$out"
            convert /tmp/tendercheck-icon.jpg -resize "${size}x${size}!" -strip "$out/ic_launcher.png"
          done

      - name: Build debug APK
        run: ./gradlew -p android :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TenderCheck-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
